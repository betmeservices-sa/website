<title>Documento protegido</title>
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:#0a1120;color:#e9eefb;display:grid;place-items:center;padding:24px}
  .gate{width:100%;max-width:400px;background:#101a30;border:1px solid #22304e;border-radius:18px;padding:32px 30px;box-shadow:0 24px 60px -24px rgba(0,0,0,.6);text-align:center}
  .lock{width:52px;height:52px;border-radius:14px;margin:0 auto 18px;display:grid;place-items:center;background:rgba(240,168,48,.14);border:1px solid rgba(240,168,48,.4)}
  .lock svg{width:26px;height:26px;stroke:#f0a830;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .eyebrow{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:#f0a830;font-weight:800;margin:0 0 8px}
  h1{font-size:1.15rem;font-weight:800;margin:0 0 6px}
  p.sub{font-size:.86rem;color:#93a4c2;margin:0 0 22px;line-height:1.5}
  form{display:flex;flex-direction:column;gap:12px}
  input{width:100%;padding:13px 15px;border-radius:12px;border:1px solid #22304e;background:#0a1120;color:#e9eefb;font-size:1rem;text-align:center;letter-spacing:.02em}
  input:focus{outline:none;border-color:#188bf6;box-shadow:0 0 0 3px rgba(24,139,246,.25)}
  button{padding:13px 15px;border:none;border-radius:12px;background:linear-gradient(90deg,#188bf6,#f0a830);color:#06210f;font-weight:800;font-size:.95rem;cursor:pointer}
  button:disabled{opacity:.6;cursor:progress}
  .err{min-height:18px;font-size:.8rem;color:#ff8a8a;margin-top:2px}
  .foot{margin-top:20px;font-size:.68rem;color:#5a6a82}
  iframe#doc{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f5f8fc}
</style>
</head>

    <h1>Documento protegido</h1>

    var enc=new TextEncoder();
    var km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(CFG.salt),iterations:CFG.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(CFG.iv)},key,b64(CFG.ct));
    return new TextDecoder().decode(buf);
  }
  var f=document.getElementById('f'),pw=document.getElementById('pw'),err=document.getElementById('err'),go=document.getElementById('go');
  f.addEventListener('submit',async function(e){
    e.preventDefault();err.textContent='';go.disabled=true;go.textContent='Descifrando…';
    try{
      var html=await decrypt(pw.value);
      var ifr=document.createElement('iframe');ifr.id='doc';ifr.setAttribute('sandbox','allow-scripts allow-popups allow-downloads');
      ifr.srcdoc=html;
      document.body.innerHTML='';document.body.appendChild(ifr);
      document.title='Documento';
    }catch(ex){
      go.disabled=false;go.textContent='Ver documento';
      err.textContent='Contraseña incorrecta. Intentá de nuevo.';
      pw.value='';pw.focus();
    }
  });
</script>
