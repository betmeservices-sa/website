<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Documento protegido</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;
    background:#05050A;color:#EDEDF5;
    font-family:-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:-30% -10% auto -10%;height:70%;pointer-events:none;
    background:radial-gradient(60% 60% at 30% 20%,rgba(34,211,238,.16),transparent 65%),
               radial-gradient(50% 50% at 80% 10%,rgba(232,121,249,.14),transparent 65%)}
  .gate{position:relative;width:100%;max-width:400px;text-align:center;
    background:#0D0D18;border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:44px 34px}
  .lock{width:52px;height:52px;margin:0 auto 22px;border-radius:14px;display:grid;place-items:center;
    background:linear-gradient(120deg,#22D3EE,#8B5CF6 55%,#E879F9);color:#06060C}
  .lock svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#67E8F9;margin-bottom:12px}
  h1{font-size:21px;font-weight:700;letter-spacing:-.01em;margin-bottom:10px}
  .sub{font-size:13.5px;line-height:1.65;color:#9A9AB0;margin-bottom:26px}
  form{display:flex;flex-direction:column;gap:11px}
  input{width:100%;padding:13px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.14);
    background:#05050A;color:#EDEDF5;font-size:15px;text-align:center;letter-spacing:.02em}
  input:focus{outline:none;border-color:#22D3EE;box-shadow:0 0 0 3px rgba(34,211,238,.22)}
  button{padding:13px 15px;border:none;border-radius:12px;cursor:pointer;font-size:14.5px;font-weight:700;
    color:#06060C;background:linear-gradient(120deg,#22D3EE,#8B5CF6 55%,#E879F9)}
  button:disabled{opacity:.55;cursor:progress}
  .err{min-height:18px;font-size:12.5px;color:#FF8A8A}
  .foot{margin-top:22px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#6E6E82}
  iframe#doc{position:fixed;inset:0;width:100%;height:100%;border:0;background:#05050A}
</style>
</head>

function b64(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();
  var btn=document.getElementById('go'),err=document.getElementById('err');
  var pw=document.getElementById('pw').value;
  err.textContent='';btn.disabled=true;btn.textContent='Abriendo...';
  try{
    var enc=new TextEncoder();
    var km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(CFG.salt),iterations:CFG.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(CFG.iv)},key,b64(CFG.ct));
    var html=new TextDecoder().decode(buf);
    /* srcdoc y no un Blob: la CSP del sitio no declara frame-src, asi que aplica
       default-src 'self' y un iframe blob: queda bloqueado ("this content is blocked").
       srcdoc hereda el origen y la CSP de la pagina, y si pasa. */
    document.getElementById('gate').remove();
    var f=document.createElement('iframe');f.id='doc';f.srcdoc=html;document.body.appendChild(f);
  }catch(_){
    err.textContent='Contrase\u00f1a incorrecta.';
    btn.disabled=false;btn.textContent='Ver propuesta';
  }
});
</script>
